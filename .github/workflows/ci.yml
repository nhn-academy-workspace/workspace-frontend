name: CI - Build & Push Docker Image

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/nhn-academy-workspace/workspace-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update manifest repo
        run: |
          git clone https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/nhn-academy-workspace/workspace-manifests.git
          cd workspace-manifests
          sed -i "s|image: ghcr.io/nhn-academy-workspace/workspace-frontend:.*|image: ghcr.io/nhn-academy-workspace/workspace-frontend:${{ github.sha }}|" apps/frontend-deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/frontend-deployment.yaml
          git commit -m "chore: update frontend image to ${{ github.sha }}" || echo "No changes to commit"
          git push
